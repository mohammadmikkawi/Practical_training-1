<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Challenge 2 - Handle Promise Rejection</title>
</head>
<body>
    <h1>Challenge 2: Handle Promise Rejection</h1>
    <p>Create a Promise that rejects with an error message "Something went wrong" after 1 second, and handle the rejection.</p>

    <script>
        const errorPromise = new Promise((_, reject) => {
            setTimeout(() => {
                reject("Something went wrong");
            }, 1000);
        });

        errorPromise
            .then(result => console.log(result))
            .catch(error => console.error(error));
    </script>
</body>
</html>
