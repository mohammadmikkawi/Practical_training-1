<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Challenge 7 - Async Function with Error Handling</title>
</head>
<body>
  <h1>Challenge 7: Async Function with Error Handling</h1>
  <p>Fetch data with try/catch to handle fetch failure.</p>

  <script>
    async function fetchWithErrorHandling() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/invalid-url');
        if (!response.ok) throw new Error('Fetch failed');
        const data = await response.json();
        console.log(data);
      } catch (error) {
        console.error('Fetch failed');
      }
    }
    fetchWithErrorHandling();
  </script>
</body>
</html>
