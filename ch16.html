<!DOCTYPE html>

  <title>Challenge 16 - Create a Class and Object</title>
</head>
<body>
  <h1>Challenge 16: Create a Class and Object</h1>
  <p>Define a Person class and create an instance.</p>

  <script>
    class Person {
      constructor(name, age) {
        this.name = name;
        this.age = age;
      }
    }

    const person1 = new Person('Sara', 25);
    console.log(person1);
  </script>
</body>
