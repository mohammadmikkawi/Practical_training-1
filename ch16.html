<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dynamic Import</title>
</head>
<body>
  <h2>Dynamic import()</h2>
  <button id="btn">Load helper</button>
  <pre id="out"></pre>

  <script>
    document.getElementById('btn').addEventListener('click', async () => {
      const code = `export function help(){ return 'helper loaded'; }`;
      const blob = new Blob([code], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const mod = await import(url);
      document.getElementById('out').textContent = mod.help();
    });
  </script>
</body>
</html>
