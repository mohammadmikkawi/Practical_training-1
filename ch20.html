<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Export Object Module</title>
</head>
<body>
  <h2>Export object with methods</h2>
  <pre id="out"></pre>

  <script type="module">
    const code = `export const obj = { sayHello(){ return 'hello'; }, add(a,b){ return a + b; } };`;
    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    import(url).then(m => {
      document.getElementById('out').textContent = m.obj.sayHello() + ' -> 2+3=' + m.obj.add(2,3);
    });
  </script>
</body>
</html>
