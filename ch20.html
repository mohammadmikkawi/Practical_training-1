<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Challenge 20 - Abstraction in OOP</title>
</head>
<body>
  <h1>Challenge 20: Abstraction in OOP</h1>
  <p>Shape class with abstract area() method, extended by Circle and Rectangle.</p>

  <script>
    class Shape {
      area() {
        throw new Error('Method "area()" must be implemented');
      }
    }

    class Circle extends Shape {
      constructor(radius) {
        super();
        this.radius = radius;
      }
      area() {
        return Math.PI * this.radius * this.radius;
      }
    }

    class Rectangle extends Shape {
      constructor(width, height) {
        super();
        this.width = width;
        this.height = height;
      }
      area() {
        return this.width * this.height;
      }
    }

    const circle = new Circle(5);
    const rectangle = new Rectangle(4, 6);

    console.log('Circle area:', circle.area());
    console.log('Rectangle area:', rectangle.area());
  </script>
</body>
</html>
