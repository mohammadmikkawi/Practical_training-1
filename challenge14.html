<!DOCTYPE html>

<meta charset="UTF-8">

<body>

<script>
function switchStatment(day){

switch(day){
    case 1:
        return "Monday";
    case 2:
        return "Tuesday";
    case 3:
        return "Wednesday";
    case 4:
        return "Thursday";
    case 5:
        return "Friday";
    case 6:
        return "Saturday";
    case 7:
        return "Sunday";
    default:
        return "Invalid day";
    }
}
console.log(switchStatment(1));// Monday
console.log(switchStatment(2));// Tuesday
console.log(switchStatment(3));// Wednesday         
console.log(switchStatment(4));// Thursday
console.log(switchStatment(5));// Friday     
console.log(switchStatment(6));// Saturday
console.log(switchStatment(8));// Invalid day
</script>
</body>
</html>
