<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Challenge 6 - Basic Async/Await Example</title>
</head>
<body>
  <h1>Challenge 6: Basic Async/Await Example</h1>
  <p>Async function that fetches user data from an API and logs it.</p>

  <script>
    async function fetchUser() {
      const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
      const data = await response.json();
      console.log(data);
    }
    fetchUser();
  </script>
</body>
</html>
