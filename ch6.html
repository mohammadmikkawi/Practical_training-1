<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ES6 Challenge 6 - Class with Constructor</title>
</head>
<body>
  <h1>Challenge 6: Create a Class with Constructor</h1>
  <script>
    class Person {
      constructor(name, age) {
        this.name = name;
        this.age = age;
        console.log(`Name: ${this.name}, Age: ${this.age}`);
      }
    }

    const person1 = new Person("moh", 22);
  </script>
</body>
