<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge 18 - XHR Get JSON</title>
</head>
<body>
  <h1>XMLHttpRequest Get JSON</h1>
  <pre id="result"></pre>

  <script>
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://jsonplaceholder.typicode.com/users/1", true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        document.getElementById("result").textContent = xhr.responseText;
      }
    };
    xhr.send();
  </script>
</body>
</html>
