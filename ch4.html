<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ES6 Challenge 4 - Callback to Arrow</title>
</head>
<body>
  <h1>Challenge 4: Convert Callback to Arrow Function</h1>
  <script>
    const greet = name => {
      console.log("Hello, " + name);
    };

    greet("Mohammad");
  </script>
</body>
</html>
