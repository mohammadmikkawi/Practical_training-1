  <title>Challenge 17 - Class with Methods</title>

<body>
  <h1>Challenge 17: Class with Methods</h1>
  <p>Create a Car class with a start() method.</p>

  <script>
    class Car {
      constructor(make, model) {
        this.make = make;
        this.model = model;
      }
      start() {
        console.log('Car started');
      }
    }

    const myCar = new Car('Toyota', 'Corolla');
    myCar.start();
  </script>
</body>
