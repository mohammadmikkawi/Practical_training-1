<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Named and Default Exports</title>
</head>
<body>
  <h2>Mixing named and default exports</h2>
  <pre id="out"></pre>

  <script type="module">
    const code = `export default function def(){ return 'default'; } export function named(){ return 'named'; }`;
    const blo = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    import(url).then(m => {
      document.getElementById('out').textContent = m.default() + ' & ' + m.named();
    });
  </script>
</body>
</html>
