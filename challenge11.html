<script>
function checkpositive(value) {
    if (value > 0) {
        return "Value is positive";
    } else if (value < 0) {
        return "Value is negative";
    } else {
        return "Value is zero";
    }
}
console.log(checkpositive(5));
console.log(checkpositive(-3));
console.log(checkpositive(0));  
</script>
