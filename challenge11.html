<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Challenge 11 - Display Users in Table</title>
</head>
<body>
  <h1>Users List</h1>
  <table border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <script>
    fetch("https://jsonplaceholder.typicode.com/users")
      .then(res => res.json())
      .then(users => {
        let rows = "";
        users.forEach(user => {
          rows += `<tr><td>${user.name}</td><td>${user.email}</td></tr>`;
        });
        document.getElementById("userTable").innerHTML = rows;
      });
  </script>
</body>
</html>
