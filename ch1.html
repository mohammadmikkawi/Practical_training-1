<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title> Closure Counter</title>
</head>
<body>
  <h2> Closure Counter (+0.1)</h2>
  <p id="value">0.0</p>
  <button id="inc">Increment by 0.1</button>

  <script>
    function makeCounter() {
      let val = 0.0;
      return function() {
        val = Math.round((val + 0.1) * 10) / 10;
        return val;
      };
    }
    const counter = makeCounter();
    document.getElementById('inc').addEventListener('click', () => {
      document.getElementById('value').textContent = counter().toFixed(1);
    });
  </script>
</body>
</html>
