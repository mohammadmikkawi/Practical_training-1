<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Challenge 1 - Create a Promise</title>
</head>
<body>
    <h1>Challenge 1: Create a Promise</h1>
    <p>Create a simple Promise that resolves with the message "Success" after 2 seconds, then log the message.</p>

    <script>
        const myPromise = new Promise((resolve) => {
            setTimeout(() => {
                resolve("Success");
            }, 2000);
        });

        myPromise.then(message => console.log(message));
    </script>
</body>
</html>
