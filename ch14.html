<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Book Module</title>
</head>
<body>
  <h2>Module exporting an object (book)</h2>
  <pre id="out"></pre>

  <script type="module">
    const code = `export const book = { title: 'Little JS', author: 'Author', price: 9.99 };`;
    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    import(url).then(m => {
      document.getElementById('out').textContent = JSON.stringify(m.book, null, 2);
    });
  </script>
</body>
</html>
