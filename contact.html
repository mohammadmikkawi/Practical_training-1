<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bin Makawi — Contact</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased">
<header class="bg-white shadow sticky top-0 z-50">
  <div class="container mx-auto flex items-center justify-between p-4">
    <a href="index.html" class="text-2xl font-bold text-amber-700">Bin Makawi</a>
    <button aria-label="Open Menu" id="menu-btn" class="md:hidden focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <nav id="menu" class="hidden md:flex md:space-x-8 text-gray-700">
      <a href="index.html" class="hover:text-amber-700">Home</a>
      <a href="about.html" class="hover:text-amber-700">About</a>
      <a href="services.html" class="hover:text-amber-700">Services</a>
      <a href="gallery.html" class="hover:text-amber-700">Gallery</a>
      <a href="contact.html" class="hover:text-amber-700">Contact</a>
    </nav>
  </div>
</header>

<section class="container mx-auto py-16 px-4 max-w-xl">
  <h1 class="text-3xl font-bold mb-8 text-center text-amber-700">Get in Touch</h1>
  <form action="#" class="space-y-6" aria-label="Contact form">
    <div>
      <label for="name" class="block mb-1 font-medium">Name</label>
      <input id="name" type="text" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700">
    </div>
    <div>
      <label for="email" class="block mb-1 font-medium">Email</label>
      <input id="email" type="email" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700">
    </div>
    <div>
      <label for="message" class="block mb-1 font-medium">Message</label>
      <textarea id="message" rows="5" required class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-700"></textarea>
    </div>
    <button type="submit" class="w-full py-3 bg-amber-700 text-white rounded-lg hover:bg-amber-800 transition">Send Message</button>
  </form>

  <div class="mt-12 text-center">
    <p class="font-semibold">Address</p>
    <p>Old City, Nablus, Palestine</p>
    <p class="mt-4 font-semibold">Phone</p>
    <p>+970 9 238 1234</p>
  </div>
</section>

<footer class="bg-gray-100">
  <div class="container mx-auto flex flex-col md:flex-row justify-between items-center p-6 text-sm">
    <span>&copy; 1999‑2025 Bin Makawi, Nablus</span>
    <span>Made with Tailwind CSS</span>
  </div>
</footer>

<script>
  document.getElementById('menu-btn').addEventListener('click',()=>{document.getElementById('menu').classList.toggle('hidden');});
</script>
</body>
</html>
