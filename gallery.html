<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bin Makawi — Gallery</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans antialiased">
<header class="bg-white shadow sticky top-0 z-50">
  <div class="container mx-auto flex items-center justify-between p-4">
    <a href="index.html" class="text-2xl font-bold text-amber-700">Bin Makawi</a>
    <button aria-label="Open Menu" id="menu-btn" class="md:hidden focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <nav id="menu" class="hidden md:flex md:space-x-8 text-gray-700">
      <a href="index.html" class="hover:text-amber-700">Home</a>
      <a href="about.html" class="hover:text-amber-700">About</a>
      <a href="services.html" class="hover:text-amber-700">Services</a>
      <a href="gallery.html" class="hover:text-amber-700">Gallery</a>
      <a href="contact.html" class="hover:text-amber-700">Contact</a>
    </nav>
  </div>
</header>

<section class="container mx-auto py-16 px-4">
  <h1 class="text-3xl font-bold mb-8 text-center text-amber-700">Roastery Moments</h1>
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=800&q=80" alt="Roasting" class="w-full h-64 object-cover rounded-lg">
    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80" alt="Spices" class="w-full h-64 object-cover rounded-lg">
    <img src="https://images.unsplash.com/photo-1487014679447-9f8336841d58?auto=format&fit=crop&w=800&q=80" alt="Tea" class="w-full h-64 object-cover rounded-lg">
    <img src="https://images.unsplash.com/photo-1484981138541-3d074aa97716?auto=format&fit=crop&w=800&q=80" alt="Beans" class="w-full h-64 object-cover rounded-lg">
    <img src="https://images.unsplash.com/photo-1475855581690-80accde3e11b?auto=format&fit=crop&w=800&q=80" alt="Café" class="w-full h-64 object-cover rounded-lg">
    <img src="https://images.unsplash.com/photo-1509042239861-932a837a4bef?auto=format&fit=crop&w=800&q=80" alt="Brew" class="w-full h-64 object-cover rounded-lg">
  </div>
</section>

<footer class="bg-gray-100">
  <div class="container mx-auto flex flex-col md:flex-row justify-between items-center p-6 text-sm">
    <span>&copy; 1999‑2025 Bin Makawi, Nablus</span>
    <span>Made with Tailwind CSS</span>
  </div>
</footer>

<script>
  document.getElementById('menu-btn').addEventListener('click',()=>{document.getElementById('menu').classList.toggle('hidden');});
</script>
</body>
</html>
