<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Named Imports with Aliases</title>
</head>
<body>
  <h2> Named imports with aliases (demo)</h2>
  <pre id="out"></pre>

  <script type="module">
    const code = `export function add(a,b){ return a + b; } export function subtract(a,b){ return a - b; }`;
    const lob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(lob);
    import(url).then(m => {
      const sum = m.add;
      const diff = m.subtract;
      document.getElementById('out').textContent = 'sum(2,2)=' + sum(2,2) + '\ndiff(5,2)=' + diff(5,2);
    });
  </script>
</body>
</html>
