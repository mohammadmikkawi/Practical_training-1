<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ES6 Challenge 10 - Template Literals</title>
</head>
<body>
  <h1>Challenge 10: Template Literals for Dynamic Strings</h1>
  <script>
    function introduce(name, age) {
      return `My name is ${name} and I am ${age} years old.`;
    }

    console.log(introduce("Mohammad", 22));
  </script>
</body>
</html>
