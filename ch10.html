<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Button Click Handler</title>
</head>
<body>
  <h2>buttonClickHandler()</h2>
  <button id="btn">Click me</button>
  <p id="out">Clicks: 0</p>

  <script>
    function buttonClickHandler() {
      let clicks = 0;
      return function() {
        clicks++;
        return clicks;
      };
    }
    const handler = buttonClickHandler();
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('out').textContent = 'Clicks: ' + handler();
    });
  </script>
</body>
</html>
