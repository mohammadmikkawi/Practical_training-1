<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Challenge 10 - Async/Await with Error Handling</title>
</head>
<body>
  <h1>Challenge 10: Async/Await with Error Handling</h1>
  <p>Make two API calls with try/catch to handle errors.</p>

  <script>
    async function fetchData() {
      try {
        const response1 = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        if (!response1.ok) throw new Error('Failed to fetch post');
        const post = await response1.json();

        const response2 = await fetch('https://jsonplaceholder.typicode.com/users/1');
        if (!response2.ok) throw new Error('Failed to fetch user');
        const user = await response2.json();

        console.log('Post:', post);
        console.log('User:', user);
      } catch (error) {
        console.error('Error:', error.message);
      }
    }

    fetchData();
  </script>
</body>
</html>
