<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Challenge 5 - Promise.all()</title>
</head>
<body>
    <h1>Challenge 5: Promise.all() to Fetch Multiple APIs</h1>
    <p>Fetch data from multiple APIs using Promise.all(). Log the results when all promises have resolved.</p>

    <script>
        const api1 = fetch("https://jsonplaceholder.typicode.com/posts/1").then(res => res.json());
        const api2 = fetch("https://jsonplaceholder.typicode.com/users/1").then(res => res.json());

        Promise.all([api1, api2])
            .then(results => {
                console.log("Post:", results[0]);
                console.log("User:", results[1]);
            })
            .catch(error => console.error("Error fetching data:", error));
    </script>
</body>
</html>
