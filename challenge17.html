<body>
<script>
function toUpperCaseArray(arr) {
  let result = []; 

  for (let i = 0; i < arr.length; i++) {
    let upper = arr[i].toUpperCase();
    result.push(upper);
  }
  return result;
}
let names = ["mohammad", "laila", "ahmad"];
let upperNames = toUpperCaseArray(names);
console.log(upperNames); 
</script>
</body>
